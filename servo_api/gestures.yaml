# Gary's gestures.
#
# One entry per gesture, each a list of keyframes. A keyframe is a time in
# seconds plus the joints it moves. Joints not mentioned at a keyframe are left
# alone, and each joint is interpolated only across the frames that name it, so
# two joints can move on different schedules inside one gesture.
#
# EVERY VALUE MUST BE QUOTED. Unquoted, YAML reads `HV: +7` as the number 7,
# which would mean "go to 7% of travel" - almost the bottom of the joint -
# rather than "nudge 7% further on". The loader refuses bare numbers for
# exactly this reason, so a mistake here fails at startup instead of on the
# robot. The forms are:
#
#   "50"          absolute, 50% of that joint's safe range
#   "+7" / "-7"   relative, exactly 7% on from where the joint STARTED
#   "+5..10"      relative, a random 5 to 10% on
#   "+/-5..10"    relative, 5 to 10% in a direction picked at random
#
# Relative always means relative to the start of the gesture, never to the
# previous keyframe - so "+0" is "back where you began", and a gesture cannot
# accumulate its way somewhere nobody intended. A range is drawn once per play,
# which is how a written-down gesture still varies each time it runs.
#
# On direction: for HV, "+" is up and "-" is down. For HH it is simply one way
# or the other; which way is which depends on how the servo is mounted, and
# nothing here needs to care.
#
# The engine drives HH, HV, RB, RW and the five right fingers. It deliberately
# does not drive the mouth (HM) - the speech path owns that - and a gesture
# naming HM is rejected.
#
# Adding a hand gesture is just another entry here. Bring one up carefully: the
# fingers have never been exercised by the engine, and a servo is strong enough
# to damage a printed part, so try a narrow movement while standing next to him
# before widening it.

# --- the three that used to be hand-built in brain/app.py -------------------

# As he starts speaking. A small movement in some direction, which is enough to
# stop the moment he begins talking looking like a machine switching on.
#
# It also closes out whatever `think` was doing. `head_flourish` plays the
# instant Gemini answers, which replaces `think` from wherever it had
# reached - and Gemini answers in about a second, well before `think`'s own
# 5.2s drumming finishes, so this is the ordinary case, not an edge one. A
# gesture that stops claiming a joint simply abandons it there, so without
# this the hand would freeze mid-drum, sometimes with a finger half open,
# until whatever eventually plays body_reset - which is not guaranteed to be
# soon, or at all, outside a tracking session. So every joint `think` might
# have been using gets a defined place to land here too, on head_flourish's
# own timeline rather than think's: the fingers close by 1.0s and the wrist
# rests by 1.0s, both able to ease from wherever they actually are, whether
# that is mid-swing or already closed because think finished on its own. The
# thumb holds at "+0" - wherever it happened to be - until 1.1s, then closes,
# because it can only close once the index already has; the fingers' own
# close at 1.0s guarantees that by the time the thumb starts. None of this
# delays speaking: gestures are fire-and-forget, so it all plays out in the
# background while he talks.
head_flourish:
  keyframes:
    - at: 0.5
      HH: "+/-5..10"
      HV: "+/-5..10"
    - at: 1.0
      RI: "0"
      RM: "0"
      RR: "0"
      RP: "0"
      RW: "100"
    - at: 1.1
      RT: "+0"
    - at: 2.1
      RT: "0"

# As he starts thinking, before the model is called. Looking up slightly reads
# as considering the question, and the fingers drum through the rest of the
# wait - the Gemini call takes about three seconds, and impatient tapping
# turns that dead air into a personality trait instead of a robot standing
# motionless.
#
# RI, RM, RR and RP, each staggered 0.4s after the last, so a finger is
# always still rising as the previous one comes back down - that overlap is
# what reads as a rolling wave across the hand instead of four fingers moving
# in lockstep. Two full rolls per finger, back to back, since one alone read
# as a single twitch rather than drumming. Each open/close leg is a full
# second, the speed already confirmed on the robot: fingers are binary, so
# there is nothing to gain by rushing a transition that will not read as
# motion until it is nearly done anyway.
#
# RT (thumb) opens at the start and holds until RI's second roll finishes at
# 4.0, then closes - the thumb can only close once the index is already
# closed, so closing it any earlier would fight the linkage. The 0.1s gap
# before RT starts closing is margin against the two commands landing on the
# same tick; RM and RP are still mid-roll when the thumb closes, which is
# fine, since the constraint is specifically thumb-after-index, not
# thumb-after-everything.
#
# Absolute "0"/"100" throughout, not relative, so the gesture always starts
# from the same shape regardless of what the hand was doing before, and if
# Gemini overruns everything just holds at its last position instead of a
# finger getting stuck mid-travel.
#
# RR and RP have never been driven ALONGSIDE other fingers before - only the
# thumb/index interlock above is confirmed, and it is unknown whether any
# other pair binds the same way. Watch this one closely the first time it
# plays, same as any other first run of a new combination.
#
# RW (wrist) rotates fully outward to 0 for the duration - 0 is most open and
# outward, 100 is most vertical with the palm facing most inward, which is
# rest. Its only named point is at 1.0s rather than 0.0, deliberately: with
# nothing named at 0.0 to pin it there, `_track` eases it in from wherever it
# actually is instead of commanding "0" as the very first frame, which read
# as a jerk rather than a movement. It simply stays at 0 rather than
# returning before the gesture ends; `body_reset` brings it back afterward
# the same way it already does for the hand and head.
think:
  keyframes:
    - at: 0.5
      HV: "+5..10"
    - at: 1.0
      RW: "0"
    - at: 0.0
      RT: "100"
    - at: 4.1
      RT: "100"
    - at: 5.1
      RT: "0"
    - at: 0.0
      RI: "0"
    - at: 1.0
      RI: "100"
    - at: 2.0
      RI: "0"
    - at: 3.0
      RI: "100"
    - at: 4.0
      RI: "0"
    - at: 0.4
      RM: "0"
    - at: 1.4
      RM: "100"
    - at: 2.4
      RM: "0"
    - at: 3.4
      RM: "100"
    - at: 4.4
      RM: "0"
    - at: 0.8
      RR: "0"
    - at: 1.8
      RR: "100"
    - at: 2.8
      RR: "0"
    - at: 3.8
      RR: "100"
    - at: 4.8
      RR: "0"
    - at: 1.2
      RP: "0"
    - at: 2.2
      RP: "100"
    - at: 3.2
      RP: "0"
    - at: 4.2
      RP: "100"
    - at: 5.2
      RP: "0"

# When he stops speaking. Absolute rather than relative, because this is the
# one movement whose whole purpose is arriving somewhere known. Slower than the
# others: it is usually the longest way to travel.
#
# HV rests at 75, not at the midpoint. 50 is the middle of the servo's travel,
# not the middle of anything useful - it points him down at the floor, well
# below a standing person's face. Rest should be where people are.
head_recenter:
  keyframes:
    - at: 0.8
      HH: "50"
      HV: "75"

# --- answers -----------------------------------------------------------------

# Two dips rather than one - a single dip reads as a glitch, two reads as
# agreement. Returns to where it started, so it can be used from any pose.
nod:
  keyframes:
    - at: 0.0
      HV: "+0"
    - at: 0.22
      HV: "-9"
    - at: 0.45
      HV: "+0"
    - at: 0.67
      HV: "-7"
    - at: 0.9
      HV: "+0"

# The same shape sideways, and a little slower, which is what keeps it from
# looking like a twitch. Ends where it began.
shake:
  keyframes:
    - at: 0.0
      HH: "+0"
    - at: 0.25
      HH: "-10"
    - at: 0.6
      HH: "+10"
    - at: 0.9
      HH: "-6"
    - at: 1.15
      HH: "+0"

# --- hand poses ---------------------------------------------------------------

# Thumb and index extended, the other three closed, wrist turned fully
# inward. Every joint gets one keyframe at the same time, which is enough to
# ease each in from wherever it actually is - there is no keyframe named at
# 0.0, so nothing snaps.
#
# No ordering needed between the thumb and index here, unlike think and
# body_reset: the "thumb can only close once the index is closed" interlock
# governs CLOSING, and both of these are opening.
#
# 100 on RW is "turned inward all the way" - the same value rest already
# uses, so from a resting hand this only moves the fingers; from anywhere
# else the wrist eases back to it over the same second.
point:
  keyframes:
    - at: 1.0
      RT: "100"
      RI: "100"
      RM: "0"
      RR: "0"
      RP: "0"
      RW: "100"

# --- returning to rest -------------------------------------------------------

# What an interaction ends with. A conversation can leave more than the head
# moved, so this puts the body back rather than only recentering the head.
# `head_recenter` stays for when only the head needs it.
#
# The thumb closes in a second; the head takes two, which reads as an
# intentional reset rather than a snap back and is easier on the printed parts.
# Slower buys nothing - at two seconds the steps are already finer than a hobby
# servo's own deadband. Each joint follows only the keyframes that name it, so
# the two happen at once at different speeds.
#
# 0 is closed for every finger. That is the firmware's external contract, not a
# quirk of the mounting, and it was confirmed by driving the thumb.
#
# All five fingers close at 0 - including the middle one, which is mounted
# backwards and flagged `inverted` in the firmware table. That inversion is
# handled inside the Arduino, so nothing on this side needs to know which way a
# finger is built. Verified by hand, one finger at a time.
#
# RW (wrist) has now been tried on its own and worked acceptably, so it joins
# here alongside the head. 100 is most vertical, mostly closed, palm facing
# most inward - the actual rest position, not a guess; 0 is most open and
# outward, toward the opposite end of travel.
#
# RB is still deliberately absent. The bicep has never been driven by the
# engine, and this gesture would move it unattended at the end of every
# interaction. It joins once it too has been tried on its own.
body_reset:
  keyframes:
    - at: 1.0
      RT: "0"
      RI: "0"
      RM: "0"
      RR: "0"
      RP: "0"
    - at: 2.0
      HH: "50"
      HV: "75"
      RW: "100"
